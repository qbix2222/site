<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F0EFEB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181B" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Пульт — личная консоль для работы с моделями: провайдеры, контекст каждого чата, рабочее пространство файлов и исполнение кода в браузере."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Пульт" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101314'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%23E4A11B' stroke-width='2.5'/%3E%3Cpath d='M16 3.5v5M16 23.5v5M3.5 16h5M23.5 16h5' stroke='%23F0EFEB' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Пульт — консоль моделей</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('pult.theme');
          const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
